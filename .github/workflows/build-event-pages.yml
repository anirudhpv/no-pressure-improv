name: Build event pages

on:
  push:
    branches: [main]
    paths:
      - "assets/data/events.json"
      - ".github/scripts/build-event-pages.js"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate event-*.html pages
        run: node .github/scripts/build-event-pages.js

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A -- 'event-*.html'
          git diff --cached --quiet || git commit -m "Regenerate event pages [skip ci]"
          git push
